spring.application.name=galaxia
# Render te da el puerto en la variable PORT; en tu PC usa 8080
server.port=${PORT:8080}
server.forward-headers-strategy=framework
# Cuenta de admin: en Render defínelas como variables de entorno
admin.usuario=${ADMIN_USUARIO:admin}
admin.clave=${ADMIN_CLAVE:admin123}
# Subida de musica y video
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB
